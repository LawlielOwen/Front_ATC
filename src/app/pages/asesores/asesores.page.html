<div class="container-sidebar">
  <div class="sidebar-wrapper">
    <app-siderbar></app-siderbar>
  </div>
  <div class="container-header">
    <app-header (toggleMenu)="mostrarSidebarMobile()"></app-header>
    <ion-content style="--background: #e2e8f0;">
      <app-button-layout>
        <app-count [label]="'Asesores activos'" [count]="totalAsesores" accentColor="#1D9E75" iconBg="#E1F5EE">
          <svg icono class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
        </app-count>
        <div class="flex gap-3">
          <app-button-new label="Nuevo Asesor" variante="btn-azul" (click)="nuevoAsesor()"></app-button-new>
        </div>
      </app-button-layout>
      <app-container-table>
        <div header>
          <app-search-layout>
            <app-search-bar placeholder="Buscar por nombre del asesor"
              (onSearch)="busquedaTexto($event)"></app-search-bar>
            <app-estatus [opciones]="EstatusAsesores" (onFilterChange)="filtroEstatus($event)"></app-estatus>
          </app-search-layout>
        </div>
        <div body>
          <app-table-skeleton *ngIf="cargando" [rows]="6"></app-table-skeleton>

          <app-table *ngIf="!cargando" [columns]="columnasAsesores" [data]="asesores"
            (actionClick)="abrirOpciones($event)" (rowClick)="detallesAsesor($event)">
          </app-table>
        </div>
        <div footer>
          <app-pagination [paginaActual]="currentPage" [totalPaginas]="totalPages"
            (onPageChange)="cambiarPaginaPadre($event)"></app-pagination>
        </div>
      </app-container-table>
    </ion-content>
  </div>
</div>
