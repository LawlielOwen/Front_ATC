<div class="bg-[#f1f5f9] rounded-[10px] overflow-hidden shadow-2xl w-full mx-auto max-h-[90vh] flex flex-col border border-gray-100">
  <ngx-sonner-toaster position="top-right" richColors="true"></ngx-sonner-toaster>

  <app-header-modal [label]="isEditMode ? 'Editar Asesor' : 'Agregar Asesor'"></app-header-modal>

  <div class="p-6 overflow-y-auto flex-1">
    <div class="flex flex-col gap-5 animate-fade-in">
      
      <app-card-form title="Información Personal">
        <svg icono class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        
        <div class="flex flex-col gap-4 md:col-span-2 w-full">
          <div class="flex gap-4">
            <div class="w-1/3 flex flex-col gap-1.5">
              <app-input tipo="text" placeholder="Nombre" label="Nombre(s) *" [(value)]="asesorNuevo.Nombre"></app-input>
            </div>
            <div class="w-1/3 flex flex-col gap-1.5">
              <app-input tipo="text" placeholder="Apellido paterno" label="Apellido Paterno *" [(value)]="asesorNuevo.app"></app-input>
            </div>
            <div class="w-1/3 flex flex-col gap-1.5">
              <app-input tipo="text" placeholder="Apellido materno" label="Apellido Materno *" [(value)]="asesorNuevo.apm"></app-input>
            </div>
          </div>

          <div class="flex gap-4">
            <div class="w-1/2 flex flex-col gap-1.5">
              <app-date label="Fecha de Nacimiento *" [(value)]="asesorNuevo.Fecha_nacimiento">
            </app-date>
            </div>
             <div class="w-1/2">
                </div>
          </div>
        </div>
      </app-card-form>

      <app-card-form title="Contacto y Sistema">
        <svg icono class="w-4 h-4 text-[#003B8A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        
        <div class="flex flex-col gap-4 md:col-span-2 w-full">
          <div class="flex gap-4">
            <div class="w-1/2 flex flex-col gap-1.5">
              <app-input tipo="text" placeholder="Ej. 4771234567" label="Teléfono" maxlength="14" [(value)]="asesorNuevo.telefono"></app-input>
            </div>
            <div class="w-1/2 flex flex-col gap-1.5">
              <app-input tipo="text" placeholder="ej. correo@atc.com.mx" label="Correo Electrónico" [(value)]="asesorNuevo.Correo"></app-input>
              <span class="text-[10px] text-slate-400 mt-1">*El nombre de usuario se generará a partir de este correo.</span>
            </div>
          </div>

          <div class="flex gap-4" *ngIf="!isEditMode">
             <div class="w-1/2 flex flex-col gap-1.5">
                <app-input tipo="password" placeholder="Mínimo 8 caracteres" label="Contraseña *" [(value)]="asesorNuevo.contra"></app-input>
             </div>
          </div>
        </div>
      </app-card-form>

      <app-card-form title="Datos Laborales">
        <svg icono class="w-4 h-4 text-[#F59E0B]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>

        <div class="flex gap-4 md:col-span-2 w-full">
          <div class="w-1/2 flex flex-col gap-y-1">
            <app-select label="Rol dentro del sistema *" [(value)]="asesorNuevo.Rol">
              <option value="">Seleccionar rol...</option>
              <option value="Administrador">Administrador</option>
              <option value="Asesor">Asesor</option>
              <option value="Cotizador">Cotizador</option>
              <option value="Almacen">Almacén</option>
              <option value="Soporte Tecnico">Soporte Técnico</option>
            </app-select>
          </div>
          <div class="w-1/2 flex flex-col gap-1.5">
             <app-date label="Fecha de Contratacion *" [(value)]="asesorNuevo.Fecha_contratacion">
            </app-date>
          </div>
        </div>
      </app-card-form>

    </div>
  </div>

  <app-footer-modal [paddingClass]="'p-4 px-6'">
    <app-button-action [label]="'Cancelar'" [claseCss]="'btn-cerrar'" (click)="cerrar()"></app-button-action>
    <app-button-action 
      [label]="isEditMode ? 'Guardar Cambios' : 'Guardar Asesor'"
      [disabled]="guardando"
      [claseCss]="'btn-agregar'"
      (click)="procesarAccion()">
    </app-button-action>
  </app-footer-modal>
</div>
