<div class="bg-[#f1f5f9] rounded-[10px] overflow-hidden shadow-2xl w-full mx-auto max-h-[90vh] 
flex flex-col border border-gray-100">
  <ngx-sonner-toaster position="top-right" richColors="true"></ngx-sonner-toaster>

  <app-header-modal [label]="isEditMode ? 'Editar Cliente' : 'Agregar Cliente'">
  <div *ngIf="!isEditMode" class="flex bg-[#e2e8f0] p-1 rounded-lg w-[240px] h-[40px] relative">
  <button (click)="uploadMode = true"
    [ngClass]="uploadMode ? 'bg-white text-[#003B8A] shadow-lg font-bold' : 'bg-transparent text-[#475569] hover:text-[#0f172a]'"
    class="flex-1 px-2 py-1 text-[11px] tracking-wide rounded-md transition-all duration-300 ease-in-out flex items-center justify-center">
    Subir CSF
  </button>
  
  <button (click)="uploadMode = false"
    [ngClass]="!uploadMode ? 'bg-white text-[#003B8A] shadow-lg font-bold' : 'bg-transparent text-[#475569] hover:text-[#0f172a]'"
    class="flex-1 px-2 py-1 text-[11px] tracking-wide rounded-md transition-all duration-300 ease-in-out flex items-center justify-center">
    Registro Manual
  </button>
</div>
  </app-header-modal>
  <div class="p-6 overflow-y-auto">
    <app-upload-modal *ngIf="uploadMode" [label]="'Arrastra el CSF aqui o haz clic para seleccionar'"
      (fileSelected)="recibirArchivo($event)"></app-upload-modal>

    <div *ngIf="!uploadMode" class="flex flex-col gap-5 animate-fade-in">
      <app-card-form title="Datos Fiscales del Cliente">
        <svg icono class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <div class="flex flex-col gap-4">
          <app-input tipo="text" placeholder="Nombre comercial o abreviado" label="Nombre Comercial"
            [(value)]="clienteNuevo.Nombre"></app-input>
          <app-input tipo="text" placeholder="RFC" label="RFC" [(value)]="clienteNuevo.RFC"></app-input>
          <app-input tipo="text" placeholder="Nombre fiscal completo" label="Razon Social"
            [(value)]="clienteNuevo.Razon_social"></app-input>
        </div>

        <div class="space-y-4">
          <div class="flex flex-col gap-y-1">
            <app-select label="Régimen Fiscal" [(value)]="clienteNuevo.Regimen_fiscal">
              <option value="">Seleccionar régimen...</option>
              <option value="601">601 - General de Ley Personas Morales</option>
              <option value="603">603 - Personas Morales con Fines no Lucrativos</option>
              <option value="605">605 - Sueldos y Salarios e Ingresos Asimilados a Salarios</option>
              <option value="606">606 - Arrendamiento</option>
              <option value="612">612 - Personas Físicas con Actividades Empresariales y Profesionales (Honorarios)
              </option>
              <option value="621">621 - Incorporación Fiscal</option>
              <option value="626">626 - Régimen Simplificado de Confianza (RESICO)</option>
            </app-select>
          </div>

          <div class="flex flex-col gap-1.5">
            <app-input tipo="text" placeholder="Calle, número, colonia, ciudad, estado" label="Dirección Fiscal"
              [(value)]="clienteNuevo.Direccion"></app-input>
          </div>

          <div class="w-1/2 pr-2">
            <div class="flex flex-col gap-1.5">
              <app-input tipo="text" maxlength="5" placeholder="ej. 37000" label="Código postal"
                [(value)]="clienteNuevo.CP"></app-input>
            </div>
          </div>
        </div>
      </app-card-form>
      <app-card-form title="Datos operativos">
        <svg icono class="w-4 h-4 text-[#003B8A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <div class="flex flex-col gap-4">
          <app-select label="Asesor Asignado" [(value)]="clienteNuevo.id_asesor">
            <option value="">Seleccione un asesor...</option>
            <option *ngFor="let asesor of asesores" [value]="asesor.id">
              {{ asesor.Nombre_completo }}
            </option>
          </app-select>
        </div>

        <div class="flex flex-col gap-4">
          <app-select label="Origen del asesor" [(value)]="clienteNuevo.asesor_tipo">
            <option value="">Seleccione origen</option>
            <option value="Asesor propio">Asesor propio</option>
            <option value="Asignado por la sucursal">Asignado por Sucursal</option>
          </app-select>
        </div>
      </app-card-form>
    </div>
  </div>
  <app-footer-modal [paddingClass]="'p-4 px-6'">
    <app-button-action [label]="'Cancelar'" [claseCss]="'btn-cerrar'" (click)="cerrar()"></app-button-action>
    <app-button-action 
  [label]="uploadMode ? 'Procesar PDF' : (isEditMode ? 'Guardar Cambios' : 'Guardar Cliente')"
  [disabled]="uploadMode && !archivoActual" 
  [claseCss]="'btn-agregar'"
  (click)="procesarAccion()">
</app-button-action>
  </app-footer-modal>
</div>
