<ion-app style="background-color: #ffffff;">
  <ngx-sonner-toaster position="top-right" richColors="true"></ngx-sonner-toaster>
  
  <div class="container-sidebar">
    
    <div class="sidebar-wrapper">
      <app-siderbar></app-siderbar>
    </div>

    <div class="container-header">
      <app-header (toggleMenu)="mostrarSidebarMobile()"></app-header>
      <ion-content style="--background :#f1f5f9;">
        <app-button-layout>
          <app-count [label]="'En stock'" [count]="5" accentColor="#1D9E75" iconBg="#E1F5EE">
            <svg icono class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
          </app-count>
          <div class="flex gap-3">
            <app-button-new label="Nueva cotizacion" variante="btn-verde"></app-button-new>
          </div>
        </app-button-layout>
           <app-container-table>
            
           </app-container-table>
      </ion-content>
    </div>
    
  </div> </ion-app>
