<div class="bg-white rounded-2xl overflow-hidden w-full max-w-3xl mx-auto max-h-[85vh] flex flex-col border border-slate-200 shadow-2xl">

  <app-header-modal [label]="demo.nombre_modelo"></app-header-modal>

  <div class="p-4 overflow-y-auto bg-[#f4f7fa] flex-1">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

      <!-- TARJETA 1: Información General -->
      <app-card-details titulo="Información General">
        <svg icono class="w-3.5 h-3.5 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>

        <div class="flex flex-col text-xs mt-1">
          <div class="flex items-center gap-3 py-2 border-b border-slate-50 last:border-0">
            <div class="w-7 h-7 rounded-md bg-[#f0f9f5] flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
              </svg>
            </div>
            <div class="flex flex-col justify-center min-w-0 flex-1">
              <span class="text-[#94a3b8] font-bold text-[9px] uppercase tracking-wider mb-0.5">Descripción</span>
              <span class="text-[#0d1f38] font-semibold text-[12px] leading-tight break-words whitespace-normal text-slate-500 italic" *ngIf="!demo.descripcion">Sin descripción registrada</span>
              <span class="text-[#0d1f38] font-semibold text-[12px] leading-tight break-words whitespace-normal" *ngIf="demo.descripcion">{{ demo.descripcion }}</span>
            </div>
          </div>

          <div class="flex items-center gap-3 py-2 border-b border-slate-50 last:border-0">
            <div class="w-7 h-7 rounded-md bg-[#f0f9f5] flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
              </svg>
            </div>
            <div class="flex flex-col justify-center min-w-0 flex-1">
              <span class="text-[#94a3b8] font-bold text-[9px] uppercase tracking-wider mb-0.5">Marca</span>
              <span class="text-[#0d1f38] font-semibold text-[12px] leading-tight break-words whitespace-normal">{{ demo.marca_proveedor || 'Sin Marca' }}</span>
            </div>
          </div>
        </div>
      </app-card-details>

      <!-- TARJETA 2: Identificación -->
      <app-card-details titulo="Identificación de Equipo">
        <svg icono class="w-3.5 h-3.5 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>

        <div class="flex flex-col text-xs mt-1">
          <div class="flex items-center gap-3 py-2 border-b border-slate-50 last:border-0">
            <div class="w-7 h-7 rounded-md bg-[#f0f9f5] flex items-center justify-center flex-shrink-0">
              <span class="text-[#1D9E75] font-bold text-xs">SN</span>
            </div>
            <div class="flex flex-col justify-center min-w-0 flex-1">
              <span class="text-[#94a3b8] font-bold text-[9px] uppercase tracking-wider mb-0.5">Codigo</span>
              <span class="text-[#0d1f38] font-semibold text-[12px] leading-tight text-slate-500 italic" *ngIf="!demo.numero_serie">No registrado</span>
              <span class="text-[#0d1f38] font-semibold text-[12px] leading-tight" *ngIf="demo.numero_serie">{{ demo.numero_serie }}</span>
            </div>
          </div>
        </div>
      </app-card-details>

    </div> 
    
    <!-- TARJETA 3: Inventario y Estado -->
    <app-card-details titulo="Inventario y Estado actual">
      <svg icono class="w-3.5 h-3.5 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mt-2 grid grid-cols-1 md:grid-cols-2 gap-4 w-full">

        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 shadow-sm"
            [ngClass]="{'bg-rose-100 border border-rose-200': demo.stock === 0, 'bg-emerald-100 border border-emerald-200': demo.stock > 0}">
            <svg class="w-6 h-6"
              [ngClass]="{'text-rose-600': demo.stock === 0, 'text-emerald-600': demo.stock > 0}" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-[10px] font-bold text-[#94a3b8] uppercase tracking-wider mb-0.5">Stock en Oficina</span>
            <div class="flex items-baseline gap-1">
              <span class="text-2xl font-extrabold leading-none"
                [ngClass]="{'text-rose-600': demo.stock === 0, 'text-[#0d1f38]': demo.stock > 0}">
                {{ demo.stock }}
              </span>
              <span class="text-xs font-semibold text-slate-400">pz</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col justify-center md:items-end md:border-l md:border-slate-200 md:pl-6">
          <span class="text-[10px] font-bold text-[#94a3b8] uppercase tracking-wider mb-1">Estatus del Equipo</span>

          <div class="flex items-center gap-2">
            <!-- Badge Activo -->
            <span *ngIf="demo.estatus === 1" class="text-[11px] font-bold text-[#0f6e56] bg-[#e8f5f0] border border-[#bce3d4] px-3 py-1.5 rounded-lg tracking-wide shadow-sm flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#1D9E75]"></span>
              En Oficina / Disponible
            </span>

            <!-- Badge En Demostración -->
            <span *ngIf="demo.estatus === 2" class="text-[11px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg tracking-wide shadow-sm flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
              Prestado / En Demostración
            </span>

            <!-- Badge Inactivo -->
            <span *ngIf="demo.estatus === 0" class="text-[11px] font-bold text-rose-700 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg tracking-wide shadow-sm flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-rose-600"></span>
              Dado de Baja
            </span>
          </div>
        </div>

      </div>
    </app-card-details>

  </div>

  <app-footer-modal [paddingClass]="'p-3 px-5 rounded-b-2xl'">
    <app-button-action [label]="'Cerrar'" [claseCss]="'btn-cerrar'" (click)="cerrarDetalle()"></app-button-action>
    <div class="flex gap-2.5">
      <!-- Botón dinámico: Eliminar si está activo/demo, o Reactivar si está dado de baja -->
      <app-button-action 
        (click)="procesarFuncion()" 
        [label]="demo.estatus === 0 ? 'Reactivar' : 'Eliminar'" 
        [esEliminar]="demo.estatus !== 0"
        [estatus]="demo.estatus" 
        *ngIf="authService.tieneAcceso(['Administrador'])">
      </app-button-action>

      <app-button-action 
        [label]="'Editar Demo'" 
        [claseCss]="'btn-editar'"
        (click)="abrirModalEdicion(demo)" 
        *ngIf="authService.tieneAcceso(['Administrador', 'Soporte Tecnico','Almacen'])">
      </app-button-action>
    </div>
  </app-footer-modal>
</div>
