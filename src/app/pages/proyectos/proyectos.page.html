<div class="container-sidebar">
  <div class="sidebar-wrapper">
    <app-siderbar></app-siderbar>
  </div>
  <div class="container-header">
    <app-header (toggleMenu)="mostrarSidebarMobile()"></app-header>
    
    <ion-content style="--background :#f1f5f9;">
      <app-button-layout>
        <app-count 
          [label]="'Proyectos del Mes'" 
          [count]="totalProyectosMes" 
          accentColor="#003B8A" 
          iconBg="#e0e7ff"  
          *ngIf="authService.tieneAcceso(['Administrador', 'Soporte Tecnico'])">
          <svg icono class="w-4 h-4 text-[#003B8A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </app-count>

        <div class="flex gap-3">
          <app-button-new 
            label="Nuevo Proyecto" 
            variante="btn-azul"   
            *ngIf="authService.tieneAcceso(['Soporte Tecnico', 'Administrador'])" 
            (click)="altaProyecto()">
          </app-button-new>
        </div>
      </app-button-layout>

      <app-container-table>
        <div header>
          <app-search-layout>
            <app-search-bar 
              placeholder="Buscar por nombre de proyecto o empresa destino"
              (onSearch)="busquedaTexto($event)">
            </app-search-bar>
            
            <app-estatus 
              [opciones]="EstatusProyectos" 
              (onFilterChange)="filtroEstatus($event)">
            </app-estatus>
          </app-search-layout>
        </div>

        <div body>
          <app-table-skeleton *ngIf="cargando" [rows]="6"></app-table-skeleton>

          <app-table 
            *ngIf="!cargando" 
            [columns]="columnasProyectos" 
            [data]="proyectos"
            (rowClick)="verDetalle($event)"  (actionClick)="abrirOpciones($event)">
          </app-table>
        </div>

        <div footer>
          <app-pagination 
            [paginaActual]="currentPage" 
            [totalPaginas]="totalPages"
            (onPageChange)="cambiarPaginaPadre($event)">
          </app-pagination>
        </div>
      </app-container-table>
      
    </ion-content>
  </div>
</div>
