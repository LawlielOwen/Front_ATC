<div class="bg-slate-200 rounded-[10px] overflow-hidden shadow-2xl w-full mx-auto max-h-[90vh] flex flex-col border border-gray-100">
  <ngx-sonner-toaster position="top-right" richColors="true"></ngx-sonner-toaster>

  <app-header-modal [label]="isEditMode ? 'Editar Ticket' : 'Agregar Ticket'"></app-header-modal>

  <div class="p-6 overflow-y-auto flex-1">
    <div class="flex flex-col gap-5 animate-fade-in">

      <!-- Datos del ticket -->
      <app-card-form title="Información del Ticket">
        <svg icono class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>

        <div class="flex flex-col gap-4 md:col-span-2">
          <div class="flex gap-4">
            <div class="w-1/2 flex flex-col gap-y-1">
              <app-select label="Asesor Asignado *" [(value)]="ticketData.id_asesor">
                <option value="">Seleccione asesor...</option>
                <option *ngFor="let asesor of asesores" [value]="asesor.id">
                  {{ asesor.Nombre }}
                </option>
              </app-select>
            </div>
            <div class="w-1/2 flex flex-col gap-1.5">
              <app-input tipo="text" placeholder="https://tickets.midominio.com/12345" label="URL del Ticket *"
                [(value)]="ticketData.url_ticket"></app-input>
            </div>
          </div>
        </div>
      </app-card-form>

      <!-- Cliente -->
      <app-card-form title="Cliente">
        <svg icono class="w-4 h-4 text-[#003B8A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>

        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Cliente *</label>

          <mat-form-field appearance="outline" class="ticket-cliente-field w-full">
            <input matInput
              [formControl]="clienteControl"
              [matAutocomplete]="autoCliente"
              placeholder="Buscar cliente registrado o escribir nombre...">
          </mat-form-field>

          <mat-autocomplete #autoCliente="matAutocomplete" [displayWith]="mostrarNombreCliente">
            <mat-option *ngFor="let cliente of clientesFiltrados" [value]="cliente">
              {{ cliente.nombre || cliente.Nombre }}
            </mat-option>
          </mat-autocomplete>

          <span class="text-[11px] text-gray-400">
            Si el cliente no está registrado en el sistema, solo escribe su nombre y se guardará como prospecto.
          </span>
        </div>
      </app-card-form>

      <!-- Comentarios -->
      <app-card-form title="Comentarios (Opcional)">
        <svg icono class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8-1.17 0-2.29-.2-3.31-.56L3 21l1.67-4.17C3.61 15.4 3 13.76 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>

        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Comentarios</label>
          <textarea
            [(ngModel)]="ticketData.comentarios"
            rows="3"
            placeholder="Detalles adicionales sobre el ticket (opcional)"
            class="w-full text-sm text-gray-700 placeholder-gray-400 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#003B8A]/20 focus:border-[#003B8A] resize-none">
          </textarea>
        </div>
      </app-card-form>

    </div>
  </div>

  <app-footer-modal [paddingClass]="'p-4 px-6'">
    <app-button-action [label]="'Cancelar'" [claseCss]="'btn-cerrar'" (click)="cerrar()"></app-button-action>
    <app-button-action [label]="isEditMode ? 'Guardar Cambios' : 'Crear Ticket'" [claseCss]="'btn-agregar'"
      (click)="procesarAccion()">
    </app-button-action>
  </app-footer-modal>
</div>
