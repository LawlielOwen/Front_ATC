<div
  class="bg-[#f1f5f9] rounded-[10px] overflow-hidden shadow-2xl w-full max-w-3xl mx-auto max-h-[90vh] flex flex-col border border-gray-100">
  <ngx-sonner-toaster position="top-right" richColors="true"></ngx-sonner-toaster>

  <app-header-modal label="Solicitar Vale de Salida"></app-header-modal>

  <div class="p-6 overflow-y-auto flex-1">
    <div class="flex flex-col gap-5 animate-fade-in">

      <app-card-form title="Información del Destino">
        <svg icono class="w-4 h-4 text-[#003B8A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>

        <div class="flex flex-col gap-4 md:col-span-2">

          <app-select label="Empresa / Cliente Destino" [(value)]="solicitud.id_cliente">
            <option value="">Seleccione el cliente...</option>
            <option *ngFor="let c of clientes" [value]="c.id">{{ c.nombre }}</option>
          </app-select>

          <div class="flex gap-4">
            <div class="w-1/2">
              <app-input tipo="text" placeholder="Ej. OC-2026-045" label="Orden de Compra"
                [(value)]="solicitud.orden_compra"></app-input>
            </div>
            <div class="w-1/2">
              <app-input tipo="text" placeholder="FAC-2026-XXXX (Opcional)" label="Factura (Si Aplica)"
                [(value)]="solicitud.num_factura"></app-input>
            </div>
          </div>

        </div>
      </app-card-form>

      <app-card-form title="Productos a Solicitar">
        <svg icono class="w-4 h-4 text-[#1D9E75]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>

        <div class="flex flex-col md:col-span-2 mt-2">

          <div *ngFor="let item of productosSolicitados; let i = index"
            class="grid grid-cols-12 gap-3 items-center mb-3 group">

            <div class="col-span-2 relative">
              <app-input tipo="text" placeholder="Ej. JP-448" [value]="item.codigo" label="Codigo"
                (valueChange)="buscarProductoBD($event, i)">
              </app-input>

              <div *ngIf="item.buscando" class="absolute right-3 top-2.5">
                <div class="w-4 h-4 border-2 border-slate-200 border-t-[#003B8A] rounded-full animate-spin"></div>
              </div>
            </div>

            <div class="col-span-3">
              <app-input tipo="text" placeholder="Nombre" [(value)]="item.Nombre" [disabled]="true"
                label="Nombre"></app-input>
            </div>

            <div class="col-span-4">
              <app-input tipo="text" placeholder="Modelo del producto..." [(value)]="item.Modelo" [disabled]="true"
                label="Modelo"></app-input>
            </div>

            <div class="col-span-2">
              <app-input tipo="number" placeholder="1" [(value)]="item.piezas" label="Cantidad"></app-input>
            </div>

            <div class="col-span-1 flex justify-center">
              <button (click)="eliminarFila(i)"
                class="bg-transparent border-none outline-none text-slate-400 hover:text-red-600 hover:bg-red-50
                 transition-all duration-200 opacity-0 group-hover:opacity-100 focus:opacity-100 p-2 mt-4
                 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>

          <div class="mt-2">
            <button (click)="agregarFilaProducto()"
              class="flex items-center gap-2 px-4 py-2 bg-transparent border-2 border-dashed border-[#003B8A] rounded-lg text-sm font-bold text-[#003B8A] hover:bg-blue-50 transition-all duration-200 outline-none">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
              </svg>
              Agregar producto
            </button>
          </div>

        </div>
      </app-card-form>

    </div>
  </div>

  <app-footer-modal [paddingClass]="'p-4 px-6'">
    <app-button-action [label]="'Cancelar'" [claseCss]="'btn-cerrar'" (click)="cerrar()"></app-button-action>
    <app-button-action [label]="'Enviar Solicitud'" [claseCss]="'btn-agregar'"
      (click)="guardarSolicitud()"></app-button-action>
  </app-footer-modal>
</div>
