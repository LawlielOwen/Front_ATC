<div class="flex items-center justify-between md:justify-start gap-2 mt-2 md:-mt-5 w-full">
  
  <div class="flex flex-col w-full md:w-auto">
    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">
      Desde
    </label>
    <div class="relative flex items-center w-full md:w-[140px] h-10 bg-white border-solid border-2 border-slate-400 rounded-[10px] focus-within:border-[#00997d] transition-colors duration-200">
      
      <mat-datepicker-toggle [for]="pickerDesde" class="absolute left-0 text-slate-400 transform scale-[0.85]"></mat-datepicker-toggle>
      
      <input 
        [matDatepicker]="pickerDesde" 
        [(ngModel)]="fechaInicio"
        [max]="fechaMax"
        (dateChange)="aplicarFiltro()"
        (click)="pickerDesde.open()"
        placeholder="dd/mm/yyyy"
        readonly
        class="w-full h-full bg-transparent border-0 outline-none focus:outline-none focus:ring-0 text-sm font-medium text-[#414a53] pl-10 pr-2 cursor-pointer rounded-[10px]">
      
      <mat-datepicker #pickerDesde></mat-datepicker>
    </div>
  </div>

  <span class="text-slate-400 mt-5">—</span>

  <div class="flex flex-col w-full md:w-auto">
    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">
      Hasta
    </label>
    <div class="relative flex items-center w-full md:w-[140px] h-10 bg-white border-solid border-2 border-slate-400 rounded-[10px] focus-within:border-[#00997d] transition-colors duration-200">
      
      <mat-datepicker-toggle [for]="pickerHasta" class="absolute left-0 text-slate-400 transform scale-[0.85]"></mat-datepicker-toggle>
      
      <input 
        [matDatepicker]="pickerHasta"
        [(ngModel)]="fechaFin"
        [min]="fechaInicio"
        [max]="fechaMax"
        (dateChange)="aplicarFiltro()"
        (click)="pickerHasta.open()"
        placeholder="dd/mm/yyyy"
        readonly
        class="w-full h-full bg-transparent border-0 outline-none focus:outline-none focus:ring-0 text-sm font-medium text-[#414a53] pl-10 pr-2 cursor-pointer rounded-[10px]">
        
      <mat-datepicker #pickerHasta></mat-datepicker>
    </div>
  </div>

</div>
