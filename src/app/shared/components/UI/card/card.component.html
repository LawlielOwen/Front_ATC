<div class="card bg-white rounded-xl border border-gray-200 p-4 shadow-sm hover:shadow-md transition-shadow duration-300">
  <div class="flex justify-between items-center mb-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-full bg-blue-200 text-[#003366] flex items-center justify-center font-extrabold text-sm uppercase shrink-0 border-2 border-blue-400">
  {{ cliente.Nombre.substring(0, 2) }}
</div>
      <div class="min-w-0 pr-2">
        <h3 class="font-bold text-[#003366] text-sm leading-tight truncate">{{ cliente.Nombre }}</h3>
        <span class="text-xs text-gray-500">{{ cliente.RFC }}</span>
      </div>
    </div>
    <app-estatus [estatus]="cliente.Estatus" class="shrink-0"></app-estatus>
  </div>
  
  <div class="flex flex-col gap-2 text-xs mt-3 border-t border-gray-100 pt-3">
    
    <!-- Sección de Asesores Actualizada -->
    <div class="flex justify-between gap-4">
      <span class="text-[#94a3b8] shrink-0">Asesor(es)</span>
      <span 
        class="text-[#414a53] font-medium text-right line-clamp-2" 
        [title]="cliente.Nombres_asesores || 'Sin asignar'">
        {{ cliente.Nombres_asesores || 'Sin asignar' }}
      </span>
    </div>
    
    <div class="flex justify-between gap-4">
      <span class="text-[#94a3b8] shrink-0">Razón Social</span>
      <span class="text-[#414a53] font-medium text-right truncate" [title]="cliente.Razon_social">
        {{ cliente.Razon_social }}
      </span>
    </div>
    
    <!-- Nueva Sección de Crédito (Solo se muestra si tiene crédito) -->
    <div class="flex justify-between items-center" *ngIf="cliente.tiene_credito === 1">
  <span class="text-[#94a3b8]">Límite de Crédito</span>
  <span class="text-emerald-800 font-extrabold bg-emerald-200 border-2 border-emerald-500 px-2 py-0.5 rounded">
    {{ cliente.limite_credito | currency:'MXN' }}
  </span>
</div>

    <div class="flex justify-between">
      <span class="text-[#94a3b8]">Registro</span>
      <span class="text-[#414a53] font-medium">{{ cliente.fecha_registro | date:'dd MMM yyyy' }}</span>    
    </div>
    
  </div>
</div>
