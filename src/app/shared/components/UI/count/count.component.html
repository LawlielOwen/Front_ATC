<div class="hidden md:inline-flex items-stretch bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden w-fit h-fit transition-all hover:shadow-md">

  <!-- Borde acento izquierdo -->
  <div class="w-1.5 flex-shrink-0" [style.background]="accentColor || '#1D9E75'"></div>

  <!-- Contenedor principal -->
  <div class="flex items-center gap-3 pl-3 pr-5 py-2.5">

    <!-- Ícono -->
    <div class="flex items-center justify-center w-9 h-9 rounded-lg flex-shrink-0" [style.background]="iconBg || '#E1F5EE'">
      <ng-content select="[icono]"></ng-content>
    </div>
 
    <!-- Textos -->
    <div class="flex flex-col justify-center gap-1">
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none">
        {{ label }}
      </span>
      <span class="text-[18px] font-bold text-[#0d1f38] leading-none tracking-tight">
        {{ count }}
      </span>
    </div>

  </div>
</div>
