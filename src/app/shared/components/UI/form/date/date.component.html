<div class="flex flex-col gap-1.5 w-full">
  <label *ngIf="label" class="text-[10px] font-semibold text-[#64748b] uppercase tracking-wider ml-1">
    {{ label }}
  </label>

  <div class="relative flex items-center w-full h-[35px] bg-[#fafbfc] border border-solid border-[#d2ddec] rounded-lg focus-within:border-[#1D9E75] focus-within:ring-1 focus-within:ring-[#1D9E75] transition-colors shadow-none">

    <mat-datepicker-toggle [for]="picker" class="absolute left-0 text-slate-400 transform scale-[0.85]"></mat-datepicker-toggle>

    <input 
      [matDatepicker]="picker" 
      [ngModel]="value" 
      (ngModelChange)="onDateChange($event)"
      [min]="min"
      [max]="max"
      (click)="picker.open()"
      [placeholder]="placeholder" 
      readonly
      class="w-full h-full bg-transparent border-0 outline-none focus:outline-none focus:ring-0 text-xs text-[#0d1f38] placeholder:text-slate-400 pl-10 pr-3 cursor-pointer rounded-lg">

    <mat-datepicker #picker></mat-datepicker>
  </div>
</div>
