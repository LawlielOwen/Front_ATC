<div class="bg-white rounded-2xl overflow-hidden w-full max-w-md mx-auto">
  
  <div class="pt-8 px-8 pb-0 text-center">
    
    <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-5">
      <svg class="w-8 h-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <h2 class="text-xl font-bold text-slate-800 mb-2">
      {{ data.titulo || '¿Estás seguro?' }}
    </h2>
    
    <p class="text-[14.5px] text-slate-500 leading-relaxed">
      {{ data.mensaje || 'Esta acción no se puede deshacer.' }}
    </p>
  </div>

  <app-footer-modal>
    <app-button-action 
      [label]="data.textoCancelar || 'Cancelar'" 
      [claseCss]="'btn-cerrar'" 
      (click)="cerrarDetalle()">
    </app-button-action>
    
    <div class="flex gap-2.5">
      <app-button-action 
        (click)="procesarFuncion()" 
        [label]="data.textoAceptar || 'Eliminar'" >
        </app-button-action>
    </div>
  </app-footer-modal>

</div>
