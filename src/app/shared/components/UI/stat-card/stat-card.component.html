<div 
  class="group relative bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col p-4 transition-all hover:shadow-md w-full cursor-pointer"
  [style.border-top]="'4px solid ' + accentColor">
  
  <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">
    {{ label }}
  </span>
  
  <span class="text-[20px] font-extrabold text-[#0d1f38] leading-tight mb-1">
    {{ count }}
  </span>
  
  <span class="text-[11px] font-medium" [ngClass]="subtextClass">
    {{ subtext }}
  </span>

<div *ngIf="tooltipText" 
    class="pointer-events-none absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-50 invisible opacity-0 group-hover:visible group-hover:opacity-100 transition-all duration-200 w-48 bg-white text-[#0d1f38] text-[11px] rounded-lg p-3 shadow-xl border border-slate-200">
    
    <div [innerHTML]="tooltipText"></div>
    
    <div class="absolute top-full left-1/2 -translate-x-1/2 w-0 h-0 border-x-4 border-x-transparent border-t-4 border-t-white"></div>
  </div>
  
</div>
