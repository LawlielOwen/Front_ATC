<div class="relative inline-block text-left" (click)="$event.stopPropagation()">

  <button
    (click)="toggleMenu($event)"
    aria-label="Opciones"
    aria-haspopup="true"
    [attr.aria-expanded]="menuAbierto"
    class="w-9 h-9 flex items-center justify-center rounded-xl text-slate-400
           bg-transparent
           hover:text-slate-600 hover:bg-slate-100/70
           transition-all duration-200 ease-out
           focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-400/60
           active:scale-95">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="currentColor">
      <circle cx="12" cy="5"  r="1.5"/>
      <circle cx="12" cy="12" r="1.5"/>
      <circle cx="12" cy="19" r="1.5"/>
    </svg>
  </button>

  <div
    *ngIf="menuAbierto"
    role="menu"
    [ngStyle]="posicionMenu"
    class="fixed w-48 !bg-white border border-slate-100 rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.10)] z-[99999] py-1.5 overflow-hidden animate-in fade-in zoom-in-95 duration-150">
  <ng-container *ngFor="let op of opciones">
    <button
      *ngIf="!op.mostrarSi || op.mostrarSi(filaDatos)"
      role="menuitem"
      (click)="ejecutarAccion(op.accion)"
      [class]="'group w-full flex items-center gap-3 px-4 py-2.5 text-[13.5px] font-medium bg-transparent transition-colors duration-150 cursor-pointer ' + 
               (op.accion === 'eliminar' || op.accion === 'cancelar' 
                 ? 'text-red-500 hover:bg-red-50/60' 
                 : 'text-slate-700 hover:bg-slate-50/80')">



      <!-- ICONO EXISTENTE: Editar -->
      <svg *ngIf="op.accion === 'editar'"
           class="w-4 h-4 shrink-0 transition-colors duration-150 text-slate-400 group-hover:text-teal-500"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>

      <svg *ngIf="op.accion === 'eliminar'"
           class="w-4 h-4 shrink-0 text-red-400"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>

      <svg *ngIf="op.accion === 'cancelar'"
           class="w-4 h-4 shrink-0 text-red-400"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>

      <svg *ngIf="op.accion === 'aceptar'"
           class="w-4 h-4 shrink-0 text-slate-400 group-hover:text-green-500"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>

      <svg *ngIf="op.accion === 'ver_pdf'"
           class="w-4 h-4 shrink-0 text-slate-400 group-hover:text-blue-500"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>

      <svg *ngIf="op.accion === 'subir_recibo'"
           class="w-4 h-4 shrink-0 transition-colors duration-150 text-slate-400 group-hover:text-blue-500"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>

      <svg *ngIf="op.accion !== 'editar' && op.accion !== 'eliminar' && op.accion !== 'cancelar' && op.accion !== 'aceptar' && op.accion !== 'ver_pdf' && op.accion !== 'subir_recibo' && op.accion !== 'avance'"
           class="w-4 h-4 shrink-0 text-slate-400 group-hover:text-slate-600"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <svg *ngIf="op.accion === 'avance'"
             class="w-4 h-4 shrink-0 transition-colors duration-150 text-slate-400 group-hover:text-indigo-500"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>

      {{ op.etiqueta }}
    </button>
  </ng-container>

  </div>

</div>
