<div class="bg-white rounded-[14px] overflow-hidden w-full border border-slate-100 shadow-sm animate-pulse mt-4">
  
  <div class="bg-[#f8fafc] px-6 py-4 flex items-center justify-between border-b border-slate-100">
    <div class="h-3 bg-slate-200 rounded w-24"></div>
    <div class="h-3 bg-slate-200 rounded w-20"></div>
    <div class="h-3 bg-slate-200 rounded w-20"></div>
    <div class="h-3 bg-slate-200 rounded w-16"></div>
    <div class="h-3 bg-slate-200 rounded w-16"></div>
    <div class="h-3 bg-slate-200 rounded w-8"></div>
  </div>

  <div class="flex flex-col">
    <div *ngFor="let i of rowsArray" class="px-6 py-5 flex items-center justify-between border-b border-slate-50 last:border-0">
      
      <div class="flex flex-col gap-2 w-1/4">
        <div class="h-4 bg-slate-200 rounded w-3/4"></div>
        <div class="h-3 bg-slate-200 rounded w-1/2"></div>
      </div>

      <div class="flex flex-col gap-2 w-1/5">
        <div class="h-4 bg-slate-200 rounded w-1/2"></div>
        <div class="h-3 bg-slate-200 rounded w-2/3"></div>
      </div>

      <div class="w-1/12 flex justify-center">
        <div class="h-4 bg-slate-200 rounded w-8"></div>
      </div>

      <div class="w-1/12 flex justify-start">
        <div class="h-4 bg-slate-200 rounded w-16"></div>
      </div>

      <div class="w-1/12 flex justify-center">
        <div class="h-7 bg-slate-200 rounded-full w-16"></div>
      </div>

      <div class="w-1/6 flex justify-between items-center pl-4">
         <div class="h-7 bg-slate-200 rounded-full w-20"></div>
         <div class="flex flex-col gap-1">
           <div class="w-1 h-1 bg-slate-200 rounded-full"></div>
           <div class="w-1 h-1 bg-slate-200 rounded-full"></div>
           <div class="w-1 h-1 bg-slate-200 rounded-full"></div>
         </div>
      </div>

    </div>
  </div>
</div>
