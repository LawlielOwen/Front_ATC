<div
  class="relative rounded-xl border shadow-sm py-5 pr-6 pl-7 overflow-hidden
         transition-all duration-200 hover:shadow-md hover:-translate-y-0.5"
  [ngClass]="activo ? 'bg-white border-slate-300' : 'bg-slate-100 border-slate-300'"
>
  <div class="absolute left-0 top-0 h-full w-1.5" [style.background]="acento"
       [style.opacity]="activo ? 1 : 0.6"></div>

  <!-- Encabezado -->
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-4 min-w-0">
      <div class="w-12 h-12 rounded-lg flex items-center justify-center shrink-0"
           [style.background]="fondoIcono">
        <svg *ngIf="tipo === 'estanteria'" class="w-6 h-6" [style.color]="acento" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v16M20 4v16M4 8h16M4 14h16M4 20h16M8 4h2v4H8zM13 10h3v4h-3z" />
        </svg>
        <svg *ngIf="tipo === 'caja'" class="w-6 h-6" [style.color]="acento" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>

      <div class="min-w-0 leading-tight">
        <p class="text-[11px] font-extrabold tracking-widest uppercase text-slate-500 whitespace-nowrap">
          {{ tipo === 'estanteria' ? 'Estantería' : 'Caja' }}
        </p>
        <h3 class="text-xl font-black truncate"
            [ngClass]="activo ? 'text-slate-900' : 'text-slate-700'">
          {{ ubicacion.codigo }}
        </h3>
      </div>
    </div>

    <span class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1 rounded-full shrink-0 whitespace-nowrap"
          [ngClass]="activo ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-300 text-slate-700'">
      <span class="w-1.5 h-1.5 rounded-full"
            [ngClass]="activo ? 'bg-emerald-600' : 'bg-slate-500'"></span>
      {{ activo ? 'Activa' : 'Inactiva' }}
    </span>
  </div>

  <!-- Descripción -->
  <p class="mt-4 text-sm font-medium truncate text-slate-700"
     [title]="ubicacion.descripcion || ''">
    {{ ubicacion.descripcion || 'Sin descripción' }}
  </p>

  <!-- Pie -->
  <div class="mt-4 pt-4 border-t border-slate-200 flex items-center justify-between gap-4">
    <span class="text-xs font-semibold text-slate-700 whitespace-nowrap">
      <ng-container *ngIf="ubicacion.fecha_registro; else sinFecha">
        {{ ubicacion.fecha_registro | date: 'dd MMM yyyy' }}
      </ng-container>
      <ng-template #sinFecha>Sin fecha</ng-template>
    </span>

   <button
  type="button"
  (click)="cambiarEstatus.emit(ubicacion)"
  class="text-xs font-bold px-4 py-2 rounded-lg text-white shadow-sm whitespace-nowrap
         transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1"
  [ngClass]="activo
    ? 'bg-red-600 hover:bg-red-700 focus:ring-red-400'
    : 'bg-emerald-600 hover:bg-emerald-700 focus:ring-emerald-400'"
>
  {{ activo ? 'Dar de baja' : 'Reactivar' }}
</button>
  </div>
</div>
