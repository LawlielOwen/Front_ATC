<div class="bg-white border border-slate-200 rounded-xl shadow-sm flex flex-col mt-4 mx-5 mb-5">  
  <!-- ZONA 1: Cabecera (Buscador y Filtros) -->
  <div class="p-4 border-b border-slate-100 bg-white rounded-t-xl">
    <ng-content select="[header]"></ng-content>
  </div>

  <!-- ZONA 2: Cuerpo (Tabla de datos) -->
  <div class="w-full overflow-x-auto bg-white">
    <ng-content select="[body]"></ng-content>
  </div>

  <!-- ZONA 3: Pie (Paginación u otros controles) -->
  <div class="p-3 px-4 border-t border-slate-100 bg-white rounded-b-xl">
    <ng-content select="[footer]"></ng-content>
  </div>

</div>
